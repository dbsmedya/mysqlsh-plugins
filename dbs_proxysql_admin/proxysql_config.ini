# DBS ProxySQL Admin Plugin Configuration File
#
# This file configures the connection to ProxySQL admin interface
# and options for user synchronization.
#
# The [proxysql] section is validated strictly: only the options shown in
# this file are accepted, and unknown option names are an error. Comments
# must be on their own line (# or ;) - inline comments after a value are
# treated as part of the value.
#
# Place this file in one of the following locations:
#   - ~/.proxysql_config.ini
#   - /etc/proxysql_sync.conf
#   - ./proxysql_config.ini (current directory)
# Or set the PROXYSQL_SYNC_CONFIG environment variable to point to your config file.

[proxysql]
# ProxySQL admin interface connection settings
host = 127.0.0.1
port = 6032
user = admin
password = admin

# Default hostgroup for new users added to ProxySQL
# Users will be assigned to this hostgroup when synced from MySQL
default_hostgroup = 0

# Comma-separated list of MySQL users to exclude from synchronization
# These users will not be synced to ProxySQL and are never deleted from
# ProxySQL by deleteOrphans
excluded_users = root, admin, mysql.sys, mysql.session, mysql.infoschema

# mysql.user Host of the accounts to synchronize (exact match, e.g. % or 10.%).
# MySQL accounts are keyed by (User, Host), so one host must be chosen to make
# the synced password deterministic. Only accounts with this exact Host value
# are synced; accounts on other hosts are left alone (and are NOT deleted by
# deleteOrphans as long as the username still exists in MySQL).
#
# EDGE CASE - changing required_host later: ProxySQL entries synced under the
# previous host keep that host's passwords until the next userSync or
# updatePasswords run, which will overwrite them with the new host's
# passwords. If the two host rows have different passwords, clients
# authenticating through ProxySQL with the old password will start failing.
# Review both host rows in mysql.user before changing this value.
required_host = %
